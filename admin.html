<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>오더 관리 — MISING.MAN</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --g25:#fcfcfd; --g50:#f9fafb; --g100:#f2f4f7; --g200:#eaecf0; --g300:#d0d5dd;
  --g400:#98a2b3; --g500:#667085; --g600:#475467; --g700:#344054; --g900:#101828;
  --blue:#2e6be6; --blue-d:#2159c9; --blue-50:#eff4ff;
  --ok:#079455; --ok-50:#ecfdf3; --ok-700:#067647;
  --warn:#d92d20; --warn-50:#fef3f2;
  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-lg:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  --body:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--g100);color:var(--g900);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:var(--body)}
.logo{display:inline-block;font-weight:900;font-size:15px;line-height:1;letter-spacing:-.05em;transform:skewX(-12deg) scaleX(.96);transform-origin:left center}

.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--g200);padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.top .ttl{font-size:14px;font-weight:600;color:var(--g600);padding-left:14px;border-left:1px solid var(--g200)}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.cnt{font-size:12.5px;color:var(--g500);font-weight:500}
.btn{border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;padding:9px 16px;cursor:pointer;box-shadow:var(--sh-xs)}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:var(--g300);border-color:var(--g300);cursor:default}
.btn.ghost{background:#fff;color:var(--g700);border-color:var(--g300)}
.btn.ghost:hover{background:var(--g50)}
.btn.sm{padding:7px 12px;font-size:13px}

.wrap{max-width:1300px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:minmax(340px,.85fr) minmax(460px,1.3fr);gap:20px;align-items:start}

.panel{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:10px}
.panel-h h2{font-size:14px;font-weight:600;margin:0}
.panel-h .sub{font-size:12.5px;color:var(--g500);margin-left:auto}

        .tools{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--g200);background:var(--g25)}
    .msel{appearance:none;-webkit-appearance:none;border:1px solid var(--g300);background:#fff;border-radius:8px;padding:8px 32px 8px 12px;font-size:13px;font-weight:600;color:var(--g700);cursor:pointer;font-family:inherit;box-shadow:var(--sh-xs);background-image:linear-gradient(45deg,transparent 50%,var(--g400) 50%),linear-gradient(135deg,var(--g400) 50%,transparent 50%);background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
    .msel:hover{border-color:var(--g400)}
    .msel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(46,107,230,.14)}
    .tools .rt{margin-left:auto;display:flex;gap:7px}

    .rows{max-height:calc(100dvh - 282px);overflow-y:auto}
    .row{position:relative;padding:16px 18px 14px;border-bottom:1px solid var(--g200);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:7px 12px;transition:background .12s}
    .row:hover{background:var(--g25)}
    .row.on{background:var(--blue-50)}
    .row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
    .row.sel{background:#fff8f7}
    .r-ck{display:none;width:17px;height:17px;accent-color:var(--blue);cursor:pointer;margin:0 2px 0 0}
    .r-brand{grid-column:1;grid-row:1;font-size:16px;font-weight:700;letter-spacing:-.025em;line-height:1.3;color:var(--g900)}
    .r-no{grid-column:2;grid-row:1;align-self:center;font-size:11.5px;font-weight:600;color:var(--g400);letter-spacing:.01em}
    .r-main{grid-column:1;grid-row:2;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
    .r-qty{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--g900)}
    .r-item{font-size:12.5px;font-weight:500;color:var(--g500);letter-spacing:-.005em}
    .r-meta{grid-column:1;grid-row:3;align-self:end;font-size:12px;font-weight:500;color:var(--g400);letter-spacing:-.005em}
    .r-chips{grid-column:2;grid-row:3;justify-self:end;align-self:end;display:flex;gap:5px}
    .r-st{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:11px;font-weight:700;line-height:1;letter-spacing:-.01em;padding:5px 21px 5px 9px;border-radius:6px;border:1px solid transparent;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
    .r-st:focus{outline:none;box-shadow:0 0 0 3px rgba(46,107,230,.18)}
    .st-gray{background-color:var(--g50);color:var(--g600);border-color:var(--g200)}
    .st-new{background-color:var(--blue-50);color:var(--blue-d);border-color:#cfe0ff}
    .st-ok{background-color:var(--ok-50);color:var(--ok-700);border-color:#abefc6}
    .st-warn{background-color:var(--warn-50);color:var(--warn);border-color:#fecdca}
    .st-hold{background-color:#fffaeb;color:#b54708;border-color:#fedf89}
    .rows.pick .row{grid-template-columns:auto 1fr auto}
    .rows.pick .r-ck{display:block;grid-column:1;grid-row:1/4;align-self:center}
    .rows.pick .r-brand,.rows.pick .r-main,.rows.pick .r-meta{grid-column:2}
    .rows.pick .r-no,.rows.pick .r-chips{grid-column:3}
    .btn.danger{background:var(--warn);border-color:var(--warn)}
    .btn.danger:hover{background:#b42318;border-color:#b42318}
    .selbar{display:none;align-items:center;gap:10px;padding:11px 18px;background:var(--warn-50);border-bottom:1px solid #fecdca}
    .selbar.on{display:flex}
    .selbar span{font-size:13px;font-weight:600;color:var(--warn)}
    .selbar .sp2{margin-left:auto;display:flex;gap:7px}
    .tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;line-height:1;letter-spacing:-.01em;border:1px solid transparent}
    .t-new{background:var(--blue-50);color:var(--blue-d);border-color:#cfe0ff}
    .t-ok{background:var(--ok-50);color:var(--ok-700);border-color:#abefc6}
    .t-warn{background:var(--warn-50);color:var(--warn);border-color:#fecdca}
    .t-gray{background:var(--g50);color:var(--g600);border-color:var(--g200)}

.empty{padding:60px 24px;text-align:center;color:var(--g500);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--g900);font-size:16px;margin-bottom:8px}

.prev{padding:18px}
.sheet-box{background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:14px;overflow:auto}
#sheet{width:100%;height:auto;display:block;background:#fff;box-shadow:var(--sh-lg)}
.acts{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--g200);background:var(--g25);flex-wrap:wrap;align-items:center}
.acts .note{font-size:12px;color:var(--g500);margin-left:auto}
.imgs{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.imgs a{display:block;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--g200)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}

.gate{max-width:400px;margin:80px auto;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:28px;box-shadow:var(--sh-lg)}
.gate h1{font-size:20px;margin:16px 0 6px;letter-spacing:-.02em}
.gate p{font-size:13.5px;color:var(--g500);margin:0 0 20px;line-height:1.6}
.gate input{width:100%;font-size:15px;border:1px solid var(--g300);border-radius:8px;padding:11px 14px;box-shadow:var(--sh-xs);margin-bottom:12px}
.gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(46,107,230,.14)}
.gate .btn{width:100%;padding:12px}
.err{font-size:13px;color:var(--warn);margin-top:12px;display:none}
.err.on{display:block}

        .r-memo{grid-column:1/-1;grid-row:4;margin-top:2px}
    .r-memo .pre{display:block;font-size:12.5px;line-height:1.55;color:var(--g600);background:var(--g50);border:1px solid var(--g200);border-left:2px solid var(--g300);border-radius:0 8px 8px 0;padding:8px 11px;white-space:pre-wrap;word-break:break-word}
    .r-memo .pre.empty{display:none}
    .r-memo .edit{display:none}
    .row.on .r-memo .pre{display:none}
    .row.on .r-memo .edit{display:block}
    .r-memo textarea{width:100%;min-height:74px;resize:vertical;font-family:inherit;font-size:13px;line-height:1.6;color:var(--g900);background:#fff;border:1px solid var(--g300);border-radius:9px;padding:10px 12px;box-shadow:var(--sh-xs)}
    .r-memo textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,107,230,.14)}
    .r-memo textarea::placeholder{color:var(--g400)}
    .r-memo .mst{display:block;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--g400);min-height:14px}
    .r-memo .mst.ok{color:var(--ok-700)}
            .r-memo .mst.err{color:var(--warn)}

@media (max-width:1040px){ .grid{grid-template-columns:1fr} .rows{max-height:none} }
</style>
</head>
<body>

<div id="gate" class="gate">
  <span class="logo">MISING.MAN</span>
  <h1>오더 관리</h1>
  <p>내부 전용 페이지입니다. 접근키를 입력해주세요.</p>
  <input id="k" type="password" placeholder="접근키" autocomplete="off" />
  <button class="btn" id="go">열기</button>
  <div class="err" id="gerr"></div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <span class="logo">MISING.MAN</span>
    <span class="ttl">오더 관리</span>
    <div class="sp">
      <span class="cnt" id="cnt"></span>
      <button class="btn ghost sm" id="reload">새로고침</button>
        <button class="btn ghost sm" id="lock">잠금</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="panel">
        <div class="panel-h"><h2>접수 목록</h2><span class="sub" id="lsub"></span></div>
                        <div class="tools">
              <select class="msel" id="mosel"></select>
              <div class="rt"><button class="btn ghost sm" id="pick">선택</button></div>
            </div>
            <div class="selbar" id="selbar">
              <span id="selcnt"></span>
              <div class="sp2">
                <button class="btn ghost sm" id="selclear">선택 해제</button>
                <button class="btn danger sm" id="seldel">삭제</button>
              </div>
            </div>
        <div class="rows" id="rows"></div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>작업 지시서</h2><span class="sub" id="psub">왼쪽에서 선택하세요</span></div>
        <div class="prev"><div class="sheet-box"><canvas id="sheet" width="1240" height="1754"></canvas></div></div>
        <div class="imgs" id="imgs"></div>
        <div class="acts">
          <button class="btn" id="dl" disabled>작업지시서 다운로드 (PNG)</button>
          <button class="btn ghost" id="dl2" disabled>2배 고해상도</button>
          <span class="note">A4 비율 · 인쇄 가능</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
      // 접근키 — 주소창에 남기지 않고 세션에만 보관
    var qk = new URLSearchParams(location.search).get('k') || '';
    var KEY = qk || sessionStorage.getItem('yjk') || '';
    if (qk) { try { sessionStorage.setItem('yjk', qk); } catch (e) {} }
    if (location.search) history.replaceState(null, '', location.pathname);
    var ORDERS = [];
    var CUR = null;

    function hdr(extra){
      var h = { 'x-admin-key': KEY };
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    }
    function api(q){
      return fetch('/api/orders' + (q || ''), { headers: hdr() })
        .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); });
    }
    function lock(){
      try { sessionStorage.removeItem('yjk'); } catch (e) {}
      KEY = '';
      location.replace(location.pathname);
    }
    function openApp(){ $('gate').style.display = 'none'; $('app').style.display = 'block'; load(); }
    $('go').addEventListener('click', function(){
      var v = $('k').value.trim(); if (!v) return; KEY = v;
      api('').then(function(res){
        if (!res.ok) { $('gerr').className = 'err on'; $('gerr').textContent = res.d.error === 'unauthorized' ? '접근키가 맞지 않습니다.' : ('오류: ' + res.d.error); return; }
        try { sessionStorage.setItem('yjk', KEY); } catch (e) {}
        openApp();
      });
    });
    $('k').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('go').click(); });
    $('lock').addEventListener('click', lock);
    if (KEY) {
      api('').then(function(res){ if (res.ok) openApp(); else { try { sessionStorage.removeItem('yjk'); } catch (e) {} KEY = ''; } });
    }

  // 오더번호 — 20260821-YJ-01
  function ono(o){
    if (o.orderNo) return o.orderNo;
    var d = o.created ? String(o.created).slice(0,10).replace(/-/g, '') : '';
    var n = String(o.no == null ? '' : o.no).replace(/[^0-9]/g, '');
    if (n.length === 1) n = '0' + n;
    return (d ? d + '-' : '') + 'YJ-' + (n || '00');
  }
        var STATUS = ['상담 전', '보류', '거절', '샘플 진행', '미팅 예정', '진행', '완료'];
      var GRADE = ['A', 'B', 'C'];
      function stCls(st){
        if (st === '완료' || st === '진행') return 'st-ok';
        if (st === '거절') return 'st-warn';
        if (st === '보류') return 'st-hold';
        if (st === '샘플 진행' || st === '미팅 예정') return 'st-new';
        return 'st-gray';
      }
      function badge(o){
        var st = o.status || '상담 전';
        if (STATUS.indexOf(st) === -1) st = '상담 전';
        var s = '<select class="r-st ' + stCls(st) + '" data-id="' + o.id + '">';
        STATUS.forEach(function(x){ s += '<option value="' + x + '"' + (x === st ? ' selected' : '') + '>' + x + '</option>'; });
        s += '</select>';
                var gr = o.grade || '';
        s += '<select class="r-st r-gr st-gray" data-id="' + o.id + '">';
        GRADE.forEach(function(x){ s += '<option value="' + x + '"' + (x === gr ? ' selected' : '') + '>' + x + '등급</option>'; });
        s += '</select>';
        if (o.moqOk === false) s += '<span class="tag t-warn">MOQ 미달</span>';
        return s;
      }
      // 월별 필터
    var MONTH = 'all';
    var LIST = [];
    function monthOf(o){ return o.created ? String(o.created).slice(0, 7) : ''; }
    function filtered(){
      if (MONTH === 'all') return ORDERS.slice();
      return ORDERS.filter(function(o){ return monthOf(o) === MONTH; });
    }
          function renderMonths(){
        var ms = {};
        ORDERS.forEach(function(o){ var m = monthOf(o); if (m) ms[m] = (ms[m] || 0) + 1; });
        var keys = Object.keys(ms).sort().reverse();
        var h = '<option value="all">전체 · ' + ORDERS.length + '건</option>';
        keys.forEach(function(k){
          var lbl = k.slice(0, 4) + '년 ' + Number(k.slice(5, 7)) + '월';
          h += '<option value="' + k + '">' + lbl + ' · ' + ms[k] + '건</option>';
        });
        var sel = $('mosel');
        sel.innerHTML = h;
        if (keys.indexOf(MONTH) === -1 && MONTH !== 'all') MONTH = 'all';
        sel.value = MONTH;
      }
      $('mosel').addEventListener('change', function(){ MONTH = $('mosel').value; render(); });

      // 선택 모드
      var PICK = false;
      $('pick').addEventListener('click', function(){
        PICK = !PICK;
        $('rows').classList.toggle('pick', PICK);
        $('pick').textContent = PICK ? '선택 종료' : '선택';
        $('pick').className = PICK ? 'btn sm' : 'btn ghost sm';
        if (!PICK) SEL = {};
        render();
      });

        // 선택 삭제
    var SEL = {};
    function selIds(){ return Object.keys(SEL).filter(function(k){ return SEL[k]; }); }
    function syncSel(){
      var ids = selIds();
              $('selbar').className = (PICK && ids.length) ? 'selbar on' : 'selbar';
      $('selcnt').textContent = ids.length + '건 선택됨';
      Array.prototype.forEach.call($('rows').querySelectorAll('.row'), function(el){
        var o = LIST[+el.getAttribute('data-i')];
        if (o) el.classList.toggle('sel', !!SEL[o.id]);
      });
    }
    function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function render(){
      var box = $('rows');
      LIST = filtered();
      $('lsub').textContent = MONTH === 'all' ? '전체 ' + LIST.length + '건' : LIST.length + '건';
      if (!LIST.length) { box.innerHTML = '<div class="empty"><b>접수된 오더가 없습니다</b>' + (MONTH === 'all' ? '사이트에서 문의가 들어오면 여기에 쌓입니다.' : '이 달에는 접수된 건이 없습니다.') + '</div>'; syncSel(); return; }
      box.innerHTML = LIST.map(function(o, i){
        var meta = [];
        if (o.due) meta.push('납기 ' + o.due);
        if (o.created) meta.push('접수 ' + String(o.created).slice(5, 10).replace('-', '.'));
        return '<div class="row" data-i="' + i + '">' +
          '<input type="checkbox" class="r-ck"' + (SEL[o.id] ? ' checked' : '') + ' />' +
          '<div class="r-brand">' + (o.brand || '(회사명 없음)') + '</div>' +
          '<div class="r-no">' + ono(o) + '</div>' +
          '<div class="r-main"><span class="r-qty">' + (o.qty ? Number(o.qty).toLocaleString() + '장' : '-') + '</span>' +
          '<span class="r-item">' + (o.items || '-') + '</span></div>' +
          '<div class="r-meta">' + (meta.join('  ·  ') || '&nbsp;') + '</div>' +
          '<div class="r-chips">' + badge(o) + '</div>' +
          '<div class="r-memo">' +
            '<span class="pre' + (o.memo ? '' : ' empty') + '">' + esc(o.memo || '') + '</span>' +
            '<div class="edit"><textarea class="r-memoin" placeholder="메모 · 상담 내용, 특이사항">' + esc(o.memo || '') + '</textarea>' +
            '<span class="mst"></span></div>' +
          '</div>' +
          '</div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('.row'), function(el){
        var o = LIST[+el.getAttribute('data-i')];
        var ck = el.querySelector('.r-ck');
        var stSel = el.querySelector('.r-st');
        if (stSel) {
          stSel.addEventListener('click', function(e){ e.stopPropagation(); });
          stSel.addEventListener('change', function(e){
            e.stopPropagation();
            var v = stSel.value, prev = o.status;
            stSel.className = 'r-st ' + stCls(v);
            stSel.disabled = true;
                          fetch('/api/orders?id=' + encodeURIComponent(o.id) + '&status=' + encodeURIComponent(v), { method: 'PATCH', headers: hdr() })
              .then(function(r){ return r.json(); })
              .then(function(d){
                stSel.disabled = false;
                if (!d.ok) { alert('상태 변경 실패: ' + (d.error || '')); stSel.value = prev || '상담 전'; stSel.className = 'r-st ' + stCls(prev); return; }
                o.status = v;
              })
              .catch(function(){ stSel.disabled = false; stSel.value = prev || '상담 전'; stSel.className = 'r-st ' + stCls(prev); alert('상태 변경 중 오류가 발생했습니다.'); });
          });
        var grSel = el.querySelector('.r-gr');
        if (grSel) {
          grSel.addEventListener('click', function(e){ e.stopPropagation(); });
          grSel.addEventListener('change', function(e){
            e.stopPropagation();
            var v = grSel.value, prev = o.grade;
            grSel.disabled = true;
                          fetch('/api/orders?id=' + encodeURIComponent(o.id) + '&grade=' + encodeURIComponent(v), { method: 'PATCH', headers: hdr() })
              .then(function(r){ return r.json(); })
              .then(function(d){
                grSel.disabled = false;
                if (!d.ok) { alert('등급 변경 실패: ' + (d.error || '')); grSel.value = prev || 'B'; return; }
                o.grade = v;
                if (CUR && CUR.id === o.id) draw(o, 1);
              })
              .catch(function(){ grSel.disabled = false; grSel.value = prev || 'B'; alert('등급 변경 중 오류가 발생했습니다.'); });
          });
        }
        var mIn = el.querySelector('.r-memoin');
        if (mIn) {
          var mSt = el.querySelector('.r-memo .mst');
          var mPre = el.querySelector('.r-memo .pre');
          mIn.addEventListener('click', function(e){ e.stopPropagation(); });
          mIn.addEventListener('change', function(e){
            e.stopPropagation();
            var v = mIn.value;
            if (v === (o.memo || '')) return;
            mSt.className = 'mst'; mSt.textContent = '저장 중…';
            fetch('/api/orders', {
              method: 'PATCH',
              headers: hdr({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({ id: o.id, memo: v })
            })
              .then(function(r){ return r.json(); })
              .then(function(d){
                if (!d.ok) { mSt.className = 'mst err'; mSt.textContent = '저장 실패 · ' + (d.error || ''); return; }
                o.memo = v;
                mPre.textContent = v;
                mPre.className = v ? 'pre' : 'pre empty';
                mSt.className = 'mst ok'; mSt.textContent = '저장됨';
                setTimeout(function(){ if (mSt.textContent === '저장됨') { mSt.className = 'mst'; mSt.textContent = ''; } }, 2000);
              })
              .catch(function(){ mSt.className = 'mst err'; mSt.textContent = '저장 중 오류'; });
          });
        }
        }
        ck.addEventListener('click', function(e){ e.stopPropagation(); });
        ck.addEventListener('change', function(){ SEL[o.id] = ck.checked; syncSel(); });
        el.addEventListener('click', function(){
          Array.prototype.forEach.call(box.querySelectorAll('.row'), function(x){ x.classList.remove('on'); });
          el.classList.add('on');
          select(o);
        });
      });
      syncSel();
    }
    $('selclear').addEventListener('click', function(){ SEL = {}; render(); });
    $('seldel').addEventListener('click', function(){
      var ids = selIds();
      if (!ids.length) return;
      if (!confirm(ids.length + '건을 삭제합니다.' + String.fromCharCode(10) + '노션 휴지통으로 이동하며 복구할 수 있습니다.')) return;
      var btn = $('seldel');
      btn.disabled = true; btn.textContent = '삭제 중…';
            fetch('/api/orders?ids=' + encodeURIComponent(ids.join(',')), { method: 'DELETE', headers: hdr() })
        .then(function(r){ return r.json(); })
        .then(function(d){
          btn.disabled = false; btn.textContent = '삭제';
          if (!d.ok) { alert('삭제 실패: ' + (d.error || '')); return; }
          SEL = {}; CUR = null;
          $('psub').textContent = '왼쪽에서 선택하세요';
          $('dl').disabled = true; $('dl2').disabled = true; $('imgs').innerHTML = '';
          var cv = $('sheet'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
          load();
        })
        .catch(function(){ btn.disabled = false; btn.textContent = '삭제'; alert('삭제 중 오류가 발생했습니다.'); });
    });
    function load(){
      $('cnt').textContent = '불러오는 중…';
      api('').then(function(res){
        if (!res.ok) { $('cnt').textContent = '오류: ' + res.d.error; return; }
        ORDERS = res.d.orders || [];
        $('cnt').textContent = '총 ' + ORDERS.length + '건';
        renderMonths();
        render();
      });
    }
  $('reload').addEventListener('click', load);

  function select(o){
    CUR = o;
    $('psub').textContent = ono(o) + ' · ' + (o.brand || '');
    $('dl').disabled = false; $('dl2').disabled = false;
    $('imgs').innerHTML = (o.images || []).map(function(u){
      return '<a href="' + u + '" target="_blank" rel="noopener"><img src="' + u + '" alt="" /></a>';
    }).join('');
        o._im = [];
    draw(o, 1);
    var urls = (o.images || []).slice(0, 3);
    if (urls.length) {
      var left = urls.length;
      urls.forEach(function(u, i){
        var im = new Image();
        im.onload = function(){ o._im[i] = im; if (--left === 0 && CUR === o) draw(o, 1); };
        im.onerror = function(){ if (--left === 0 && CUR === o) draw(o, 1); };
        im.src = '/api/img?key=' + encodeURIComponent(KEY) + '&url=' + encodeURIComponent(u);
      });
    }
  }

  // ── 캔버스 유틸 ──
  var INK = '#101828', SUB = '#667085', LINE = '#98a2b3', SOFT = '#d0d5dd', LB = '#f2f4f7', BLUE = '#2e6be6';
  function F(w, s){ return w + ' ' + s + 'px "Pretendard Variable", Pretendard, sans-serif'; }

  function box(c, x, y, w, h, lw){
    c.strokeStyle = LINE; c.lineWidth = lw || 1;
    c.strokeRect(x + 0.5, y + 0.5, w, h);
  }
  function fillBox(c, x, y, w, h, bg){
    c.fillStyle = bg; c.fillRect(x, y, w, h); box(c, x, y, w, h);
  }
  function ctext(c, t, x, y, w, h, font, color){
    c.font = font; c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(t == null ? '' : t), x + w / 2, y + h / 2 + 1);
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  }
  function ltext(c, t, x, y, w, h, font, color){
    c.font = font; c.fillStyle = color; c.textBaseline = 'middle';
    var s = String(t == null || t === '' ? '-' : t);
    while (c.measureText(s).width > w - 20 && s.length > 2) s = s.slice(0, -2);
    c.fillText(s, x + 10, y + h / 2 + 1);
    c.textBaseline = 'alphabetic';
  }
  function wrapText(c, text, x, y, maxW, lh){
    var lines = String(text == null || text === '' ? '-' : text).split(String.fromCharCode(10));
    var cy = y;
    for (var li = 0; li < lines.length; li++){
      var words = lines[li].split(' '), line = '';
      for (var i = 0; i < words.length; i++){
        var test = line ? line + ' ' + words[i] : words[i];
        if (c.measureText(test).width > maxW && line){ c.fillText(line, x, cy); cy += lh; line = words[i]; }
        else line = test;
        while (c.measureText(line).width > maxW && line.length > 1){
          var cut = line.length;
          while (cut > 1 && c.measureText(line.slice(0, cut)).width > maxW) cut--;
          c.fillText(line.slice(0, cut), x, cy); cy += lh; line = line.slice(cut);
        }
      }
      c.fillText(line, x, cy); cy += lh;
    }
    return cy;
  }

  function draw(o, scale){
    var cv = $('sheet'), W = 1240, H = 1754;
    cv.width = W * scale; cv.height = H * scale;
    var c = cv.getContext('2d');
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

    var M = 50, X = M, CW = W - M * 2;      // 1140
    var LW = 700, RW = CW - LW;             // 좌 700 / 우 440
    var RX = X + LW;

    // ── 1. 타이틀 + 결재란 ──
    var y = M, th = 110;
    box(c, X, y, LW, th, 1.6);
          ctext(c, '작 업 지 시 서', X, y, LW, th, F(700, 36), INK);

    var ax = RX, aw = RW, alw = 56;
    box(c, ax, y, aw, th, 1.6);
    fillBox(c, ax, y, alw, th, LB);
    ctext(c, '결재', ax, y, alw, th, F(600, 13), SUB);
    var cw3 = (aw - alw) / 3;
          var names = ['담당', '이사', '대표'];
    for (var i = 0; i < 3; i++){
      var cx = ax + alw + cw3 * i;
      fillBox(c, cx, y, cw3, 30, LB);
      ctext(c, names[i], cx, y, cw3, 30, F(600, 12.5), SUB);
      box(c, cx, y + 30, cw3, th - 30);
    }
    y += th;

    // ── 2. 기본 정보 ──
    var rh = 42;
    function infoRow(ry, pairs){
      var lw = 108, vw = (LW - lw * 2) / 2;
      var cx = X;
      for (var i = 0; i < pairs.length; i++){
        fillBox(c, cx, ry, lw, rh, LB);
        ctext(c, pairs[i][0], cx, ry, lw, rh, F(600, 12.5), SUB);
        cx += lw;
        box(c, cx, ry, vw, rh);
        ltext(c, pairs[i][1], cx, ry, vw, rh, F(500, 14), INK);
        cx += vw;
      }
    }
    infoRow(y, [['브랜드', o.brand], ['담당자', o.manager]]);
    infoRow(y + rh, [['연락처', o.phone], ['접수일', o.created ? String(o.created).slice(0, 10) : '-']]);
    infoRow(y + rh * 2, [['판매 채널', o.channel], ['유입 경로', o.source]]);

    var olw = 130, ovw = RW - olw;
    fillBox(c, RX, y, olw, rh, LB);
    ctext(c, 'ORDER NO', RX, y, olw, rh, F(700, 12), SUB);
    box(c, RX + olw, y, ovw, rh);
    ltext(c, ono(o), RX + olw, y, ovw, rh, F(700, 16), BLUE);

    fillBox(c, RX, y + rh, olw, rh, LB);
    ctext(c, 'NAME', RX, y + rh, olw, rh, F(700, 12), SUB);
    box(c, RX + olw, y + rh, ovw, rh);
    ltext(c, (o.items || '-'), RX + olw, y + rh, ovw, rh, F(600, 14), INK);

    fillBox(c, RX, y + rh * 2, olw, rh, LB);
    ctext(c, '납기일', RX, y + rh * 2, olw, rh, F(700, 12), SUB);
    box(c, RX + olw, y + rh * 2, ovw, rh);
    ltext(c, o.due, RX + olw, y + rh * 2, ovw, rh, F(700, 15), INK);

    y += rh * 3;

    // ── 3. 본문 ──
    var bodyTop = y, bodyBottom = 1490, bodyH = bodyBottom - bodyTop;
    var hh = 34;

          // 3-1. 좌: 작업 지시 내용
      fillBox(c, X, bodyTop, LW, hh, LB);
      ctext(c, '작 업 지 시 내 용', X, bodyTop, LW, hh, F(700, 14), INK);

      // 줄바꿈 계산 (그리지 않고 라인만 반환)
      function lines(txt, maxW){
        var src = String(txt == null || txt === '' ? '-' : txt).split(String.fromCharCode(10));
        var out = [];
        for (var li = 0; li < src.length; li++){
          var words = src[li].split(' '), line = '';
          for (var i = 0; i < words.length; i++){
            var test = line ? line + ' ' + words[i] : words[i];
            if (c.measureText(test).width > maxW && line){ out.push(line); line = words[i]; }
            else line = test;
            while (c.measureText(line).width > maxW && line.length > 1){
              var cut = line.length;
              while (cut > 1 && c.measureText(line.slice(0, cut)).width > maxW) cut--;
              out.push(line.slice(0, cut)); line = line.slice(cut);
            }
          }
          out.push(line);
        }
        return out;
      }

      // 하단 지시 항목 표 — 높이 먼저 계산해 바닥에 고정
      var blocks = [
        ['주원자재 · 부자재', o.material],
        ['디테일 내용', o.detailSpec],
        ['사이즈 스펙', o.sizeSpec],
        ['부위별 봉제 · 가공', o.sewing],
        ['포장 명세', o.packing],
        ['QC 기준 · 검사', (o.qc || '-') + (o.qcWays ? String.fromCharCode(10) + '검사 방식 : ' + o.qcWays : '')]
      ];
      var labW = 148, valW = LW - labW, lh2 = 21;
      c.font = F(400, 13.5);
      var wrapped = [], heights = [], tableH = 0;
      for (var b = 0; b < blocks.length; b++){
        var ls = lines(blocks[b][1], valW - 34);
        var rh2 = Math.max(58, ls.length * lh2 + 28);
        wrapped.push(ls); heights.push(rh2); tableH += rh2;
      }
      var maxTable = bodyH - hh - 30 - 200;
      if (tableH > maxTable) { var k2 = maxTable / tableH; tableH = 0; for (var b2 = 0; b2 < heights.length; b2++){ heights[b2] = Math.floor(heights[b2] * k2); tableH += heights[b2]; } }

      // 상품 이미지 · 도식화 — 남은 공간 전부
              var ihY = bodyTop + hh, ihH = 38;
      var imgTop = ihY + ihH;
      var imgH = bodyBottom - tableH - imgTop;
      fillBox(c, X, ihY, LW, ihH, LB);
      ctext(c, '상 품 이 미 지   ·   도 식 화', X, ihY, LW, ihH, F(600, 11.5), SUB);
      box(c, X, imgTop, LW, imgH);
      var ims = (o._im || []).filter(Boolean);
      var slots = (o.images || []).slice(0, 3).length;
      if (slots) {
        var cw = LW / slots;
        for (var q = 0; q < slots; q++) {
          var qx = X + cw * q;
          if (q) { c.strokeStyle = SOFT; c.lineWidth = 1; c.beginPath(); c.moveTo(Math.round(qx) + 0.5, imgTop); c.lineTo(Math.round(qx) + 0.5, imgTop + imgH); c.stroke(); }
          var im2 = ims[q];
          if (im2 && im2.naturalWidth) {
            var k = Math.min((cw - 34) / im2.naturalWidth, (imgH - 34) / im2.naturalHeight);
            var dw = im2.naturalWidth * k, dh = im2.naturalHeight * k;
            c.drawImage(im2, qx + (cw - dw) / 2, imgTop + (imgH - dh) / 2, dw, dh);
          } else {
            ctext(c, '이미지 ' + (q + 1), qx, imgTop, cw, imgH, F(400, 12), '#c4cad3');
          }
        }
      } else {
        ctext(c, '첨부된 상품 이미지가 없습니다', X, imgTop, LW, imgH, F(400, 13), '#c4cad3');
      }

      // 표 그리기
      var ry = bodyBottom - tableH;
      for (var b3 = 0; b3 < blocks.length; b3++){
        var rh3 = heights[b3], ls3 = wrapped[b3];
        fillBox(c, X, ry, labW, rh3, LB);
        c.font = F(600, 12.5);
        var lb = lines(blocks[b3][0], labW - 20);
        c.fillStyle = SUB; c.textAlign = 'center';
        for (var m = 0; m < lb.length; m++) c.fillText(lb[m], X + labW / 2, ry + rh3 / 2 + 5 - (lb.length - 1) * 8 + m * 16);
        c.textAlign = 'left';
        box(c, X + labW, ry, valW, rh3);
        c.font = F(400, 13.5); c.fillStyle = INK;
        var shown = Math.min(ls3.length, Math.floor((rh3 - 16) / lh2));
        var ty = ry + (rh3 - shown * lh2) / 2 + 15;
        for (var L3 = 0; L3 < shown; L3++) c.fillText(ls3[L3], X + labW + 17, ty + L3 * lh2);
        ry += rh3;
      }

    // 3-2. 우: 오더 사양
    var sx = RX, sw = RW;
    fillBox(c, sx, bodyTop, sw, hh, LB);
    ctext(c, '오 더 사 양', sx, bodyTop, sw, hh, F(700, 14), INK);
    var specs = [
      ['품목', o.items],
      ['스타일 수', o.styles ? o.styles + '개' : '-'],
      ['컬러 수', o.colors ? o.colors + '개' : '-'],
      ['사이즈 수', o.sizes ? o.sizes + '개' : '-'],
      ['컬러·사이즈당', o.colors && o.sizes && o.styles && o.qty ? Math.round(o.qty / (o.colors * o.sizes * o.styles)).toLocaleString() + '장' : '-'],
      ['총 수량', o.qty ? Number(o.qty).toLocaleString() + '장' : '-'],
      ['최종 납기일', o.due],
      ['희망 단가', o.price],
      ['원단·부자재', o.fabric],
      ['보유 자료', o.asset],
      ['등급', o.grade ? o.grade + '등급' : '-'],
      ['MOQ 충족', o.moqOk === true ? '충족' : (o.moqOk === false ? '미달' : '-')],
      ['진행 상태', o.status]
    ];
    var srh = 38, slw = 130;
    for (var s2 = 0; s2 < specs.length; s2++){
      var sy = bodyTop + hh + srh * s2;
      fillBox(c, sx, sy, slw, srh, LB);
      ctext(c, specs[s2][0], sx, sy, slw, srh, F(600, 12), SUB);
      box(c, sx + slw, sy, sw - slw, srh);
      var big = (specs[s2][0] === '총 수량');
      ltext(c, specs[s2][1], sx + slw, sy, sw - slw, srh, F(big ? 700 : 500, big ? 16 : 13.5), big ? BLUE : INK);
    }
    var afterSpec = bodyTop + hh + srh * specs.length;

    // 3-3. 우 하단: 발주 구성 / 첨부
    fillBox(c, sx, afterSpec, sw, hh, LB);
    ctext(c, '발 주 구 성', sx, afterSpec, sw, hh, F(700, 13), INK);
    var nh = bodyBottom - afterSpec - hh;
    box(c, sx, afterSpec + hh, sw, nh);
    c.font = F(400, 13.5); c.fillStyle = INK;
    var ny = wrapText(c, o.compose, sx + 16, afterSpec + hh + 26, sw - 32, 21);
    c.font = F(400, 13); c.fillStyle = SUB;
    wrapText(c, '첨부 상품 이미지 ' + ((o.images || []).length) + '장', sx + 16, ny + 12, sw - 32, 20);

    // ── 4. 하단 ──
    var fy = bodyBottom, fh = 1704 - bodyBottom;
    fillBox(c, X, fy, LW, hh, LB);
    ctext(c, '작 업 시 주 의 사 항', X, fy, LW, hh, F(700, 13), INK);
    box(c, X, fy + hh, LW, fh - hh);
    c.font = F(400, 13.5); c.fillStyle = INK;
    wrapText(c, o.detail, X + 22, fy + hh + 26, LW - 44, 21);

    fillBox(c, RX, fy, RW, hh, LB);
    ctext(c, 'SWATCH · 원단', RX, fy, RW, hh, F(700, 13), INK);
    box(c, RX, fy + hh, RW, fh - hh);
    c.fillStyle = LB; c.fillRect(RX + 16, fy + hh + 18, 96, 96); box(c, RX + 16, fy + hh + 18, 96, 96);
    c.font = F(400, 13); c.fillStyle = SUB;
    ctext(c, '원단 스와치', RX + 16, fy + hh + 18, 96, 96, F(400, 11.5), SUB);
    c.font = F(500, 13.5); c.fillStyle = INK;
    wrapText(c, '원단 · 부자재 : ' + (o.fabric || '-'), RX + 126, fy + hh + 42, RW - 142, 21);
    c.font = F(400, 13); c.fillStyle = SUB;
    wrapText(c, '보유 자료 : ' + (o.asset || '-'), RX + 126, fy + hh + 72, RW - 142, 20);

    box(c, X, M, CW, 1704 - M, 1.6);
  }

  function download(scale){
    if (!CUR) return;
    draw(CUR, scale);
    var a = document.createElement('a');
    a.href = $('sheet').toDataURL('image/png');
    a.download = '작업지시서_' + ono(CUR) + '_' + String(CUR.brand || '').replace(/[^가-힣a-zA-Z0-9]/g, '') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    if (scale !== 1) draw(CUR, 1);
  }
  $('dl').addEventListener('click', function(){ download(1); });
  $('dl2').addEventListener('click', function(){ download(2); });
})();
</script>
</body>
